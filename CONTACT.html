<main>
<h1>Register For A Trip</h1>
<p>Fill this form. My JavaScript will check it before it sends.</p>
<p id="note" style="color:red;text-align:center"></p>

<form class="myform" onsubmit="return checkMyForm()">
<label for="fullName">Full Name</label>
<input id="fullName" type="text" placeholder="e.g.Maseru 'Musi">

<label for="myEmail">Email Address</label>
<input id="myEmail" type="email" placeholder="e.g. Maseru@mail.com">

<label for="myPhone">Phone Number</label>
<input id="myPhone" type="tel" placeholder="e.g. 58712345">

<label>Gender</label><br>
<input type="radio" name="myGender" value="Male" style="width:auto"> Male
<input type="radio" name="myGender" value="Female" style="width:auto"> Female
<br><br>

<label for="firstPass">Password</label>
<input id="firstPass" type="password" placeholder="8 letters or more">

<label for="secondPass">Confirm Password</label>
<input id="secondPass" type="password" placeholder="Write it again">

<label for="myTrip">Where Do You Want To Go?</label>
<input id="myTrip" type="text" placeholder="e.g. Sani Pass">

<button type="submit">Send My Booking</button>
</form>
</main>
